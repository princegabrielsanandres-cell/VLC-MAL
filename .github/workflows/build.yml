name: Build VLC-MAL

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout VLC-MAL
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            ant \
            autopoint \
            cmake \
            build-essential \
            libtool-bin \
            patch \
            pkg-config \
            protobuf-compiler \
            ragel \
            subversion \
            unzip \
            git \
            flex \
            gperf \
            python3 \
            wget

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Android components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"

          if [ ! -d "$NDK_DIR" ]; then
            echo "No Android NDK found"
            exit 1
          fi

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare VLC source
        run: |
          chmod +x buildsystem/compile.sh
          ./buildsystem/compile.sh -a arm64-v8a --init

      - name: Generate VLC appdata file
        run: |
          cd libvlcjni/vlc

          if [ -f share/org.videolan.vlc.appdata.xml.in.in ]; then
            cp share/org.videolan.vlc.appdata.xml.in.in share/org.videolan.vlc.appdata.xml
          elif [ -f share/org.videolan.vlc.appdata.xml.in ]; then
            cp share/org.videolan.vlc.appdata.xml.in share/org.videolan.vlc.appdata.xml
          else
            echo "No VLC appdata template found"
            find share -maxdepth 2 -iname '*appdata*' -print || true
            exit 1
          fi

          test -f share/org.videolan.vlc.appdata.xml
          echo "Appdata file created successfully"

      - name: Build VLC-MAL
        run: |
          chmod +x buildsystem/compile.sh
          set -o pipefail
          ./buildsystem/compile.sh -a arm64-v8a 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "========== POSSIBLE ERRORS =========="
          if [ -f build.log ]; then
            grep -Ein -B5 -A10 \
              'error:|Error [0-9]+|No such file|Permission denied|cannot|failed|FAILED' \
              build.log | tail -300 || true
          fi

      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-MAL-debug
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
