name: Build VLC-MAL

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
       
      - name: Install NDK
        run: |
            sdkmanager "ndk;27.2.12479018"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0"
            - name: Generate VLC appdata file
               run: |
          cd libvlcjni/vlc
          cp share/org.videolan.vlc.appdata.xml.in share/org.videolan.vlc.appdata.xml
          test -f share/org.videolan.vlc.appdata.xml
          echo "Appdata file created successfully"
          
      - name: Build VLC-MAL
        run: |
          gradle :application:app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-MAL-debug
          path: application/app/build/outputs/apk/**/*.apk
