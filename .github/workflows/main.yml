name: Build VLC-MAL

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout VLC-MAL
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "platform-tools" \
                     "cmake;3.22.1" \
                     "ndk;21.4.7075529"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autopoint \
            ant \
            cmake \
            build-essential \
            libtool-bin \
            patch \
            pkg-config \
            protobuf-compiler \
            ragel \
            subversion \
            unzip \
            git \
            flex \
            python3 \
            wget \
            curl

      - name: Build VLC-MAL
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          chmod +x buildsystem/compile.sh
          ./buildsystem/compile.sh -a arm64

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VLC-MAL-debug
          path: |
            **/*.apk
          if-no-files-found: error
